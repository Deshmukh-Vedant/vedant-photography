<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Create Account - Vedant Photography</title>

  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)), url('kaira.jpg') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    .signup-card {
      max-width: 440px;
      width: 100%;
      background: rgba(22, 26, 32, 0.95);
      border: 1px solid #2e3644;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    .form-control {
      background-color: #0d1014;
      border: 1px solid #2c3442;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .form-control:focus {
      background-color: #12161c;
      border-color: #27ae60;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(39, 174, 96, 0.25);
    }
    .btn-signup {
      background: #27ae60;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      border: none;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-signup:hover { background: #219653; }
  </style>
</head>
<body>

  <div class="signup-card text-center">
    <a href="index.html">
      <img src="usericon5.png" width="75" height="75" class="rounded-circle mb-3" alt="New User" onerror="this.src='vedantlogo.jpeg'">
    </a>
    <h3 style="color: #fff; font-weight: 700;">Create New Account</h3>
    <p class="text-muted mb-4" style="font-size: 0.9rem;">Join Vedant Photography for seamless booking</p>

    <div id="signup-alert" class="alert d-none" role="alert"></div>

    <form id="signup-form" class="text-start">
      <div class="mb-3">
        <label class="form-label text-muted small">Customer Full Name *</label>
        <input type="text" id="reg-name" class="form-control" required placeholder="e.g. Shruti Sharma">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">Email Address *</label>
        <input type="email" id="reg-email" class="form-control" required placeholder="e.g. shruti@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">Phone Number *</label>
        <input type="tel" id="reg-phone" class="form-control" required placeholder="e.g. 9876543210">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">Password *</label>
        <input type="password" id="reg-pass" class="form-control" required placeholder="Create a strong password">
      </div>

      <button type="submit" id="btn-submit" class="btn-signup mt-2">
        <i class="bi bi-person-plus me-2"></i>Register Account
      </button>
    </form>

    <div class="mt-4 text-center">
      <p class="text-muted small mb-1">Already registered? <a href="login.html" style="color:#27ae60; font-weight:600;">Sign in here</a></p>
      <a href="index.html" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form');
      const btn = document.getElementById('btn-submit');
      const alertEl = document.getElementById('signup-alert');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating account...`;
        alertEl.classList.add('d-none');

        const payload = {
          user: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          number: document.getElementById('reg-phone').value,
          pass: document.getElementById('reg-pass').value
        };

        try {
          const res = await API.register(payload);
          if (res.success) {
            alertEl.className = 'alert alert-success';
            alertEl.textContent = 'Account created successfully! Redirecting...';
            alertEl.classList.remove('d-none');
            setTimeout(() => {
              window.location.href = 'book.html';
            }, 1200);
          } else {
            throw new Error(res.message || 'Registration failed.');
          }
        } catch (err) {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = err.message || 'Error registering. Please try again.';
          alertEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-person-plus me-2"></i>Register Account`;
        }
      });
    });
  </script>
</body>
</html>
