<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Customer & Admin Login - Vedant Photography</title>

  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)), url('lion.jpg') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      background: rgba(22, 26, 32, 0.95);
      border: 1px solid #2e3644;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    .form-control {
      background-color: #0d1014;
      border: 1px solid #2c3442;
      color: #fff;
      padding: 11px 14px;
      border-radius: 8px;
    }
    .form-control:focus {
      background-color: #12161c;
      border-color: #27ae60;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(39, 174, 96, 0.25);
    }
    .btn-login {
      background: #27ae60;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      border: none;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #219653; }
  </style>
</head>
<body>

  <div class="login-card text-center">
    <a href="index.html">
      <img src="usericon3.png" width="80" height="80" class="rounded-circle mb-3" alt="User Icon" onerror="this.src='vedantlogo.jpeg'">
    </a>
    <h3 style="color: #fff; font-weight: 700;">Customer & Admin Login</h3>
    <p class="text-muted mb-4" style="font-size: 0.9rem;">Sign in to access your bookings and orders</p>

    <div id="login-alert" class="alert d-none" role="alert"></div>

    <form id="login-form" class="text-start">
      <div class="mb-3">
        <label class="form-label text-muted small">Username or Email</label>
        <input type="text" id="login-user" class="form-control" required placeholder="Enter username or email">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">Password</label>
        <input type="password" id="login-pass" class="form-control" required placeholder="Enter password">
      </div>

      <button type="submit" id="btn-submit" class="btn-login mt-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="mt-4 text-center">
      <p class="text-muted small mb-1">Don't have an account? <a href="signup.html" style="color:#27ae60; font-weight:600;">Sign up</a></p>
      <a href="index.html" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const alertEl = document.getElementById('login-alert');
      if (params.get('signup') === 'success') {
        alertEl.className = 'alert alert-success';
        alertEl.textContent = 'Account created successfully! Please sign in.';
        alertEl.classList.remove('d-none');
      }

      const form = document.getElementById('login-form');
      const btn = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;
        alertEl.classList.add('d-none');

        const identifier = document.getElementById('login-user').value;
        const pass = document.getElementById('login-pass').value;

        try {
          const res = await API.login({ user: identifier, pass: pass });
          if (res.success) {
            alertEl.className = 'alert alert-success';
            alertEl.textContent = 'Login successful! Redirecting...';
            alertEl.classList.remove('d-none');

            setTimeout(() => {
              if (res.user && res.user.role === 'admin') {
                window.location.href = 'admin.html';
              } else {
                window.location.href = 'book.html';
              }
            }, 1000);
          } else {
            throw new Error(res.message || 'Login failed.');
          }
        } catch (err) {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = err.message || 'Invalid credentials. Please try again.';
          alertEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i>Sign In`;
        }
      });
    });
  </script>
</body>
</html>
